<svg width="1200" height="46" viewBox="0 0 1200 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
<defs>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#06B6D4" stop-opacity="0"/>
<stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.9"/>
<stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
</linearGradient>
</defs>
<line x1="0" y1="23" x2="1200" y2="23" stroke="#232a33" stroke-width="1"/>
<rect x="-300" y="0" width="300" height="46" fill="url(#scan)" opacity="0.7">
<animate attributeName="x" values="-300;1200" dur="4.5s" repeatCount="indefinite"/>
</rect>
<circle cx="0" cy="23" r="2.5" fill="#3B82F6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="1200" cy="23" r="2.5" fill="#3B82F6"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
